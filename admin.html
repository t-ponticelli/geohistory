<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoHistory Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #fef7ed;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    color: #1a1a1a;
    padding: 20px;
    min-height: 100vh;
  }
  .container { max-width: 900px; margin: 0 auto; }

  h1 { font-size: 1.8rem; margin-bottom: 8px; font-style: italic; }
  h1 span { color: #bf0a30; }
  .subtitle { color: #666; margin-bottom: 30px; font-size: 0.9rem; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 2px solid #e8dfd0;
    flex-wrap: wrap;
  }
  .tab {
    background: none;
    border: none;
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    color: #666;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
  }
  .tab.active { color: #002868; border-bottom-color: #002868; }

  .section { display: none; }
  .section.active { display: block; }

  .card {
    background: #fffbf3;
    border: 1px solid #e8dfd0;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 0; }

  label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.85rem; color: #444; }
  input, textarea, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #e8dfd0;
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.95rem;
    background: white;
  }
  textarea { resize: vertical; min-height: 60px; }

  .btn {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .btn-primary { background: #002868; color: white; }
  .btn-danger { background: #fee; color: #c00; border: 1px solid #fcc; }
  .btn-secondary { background: white; color: #444; border: 1px solid #ddd; }
  .btn-sm { padding: 6px 12px; font-size: 0.8rem; }

  .question-list { display: flex; flex-direction: column; gap: 8px; }
  .question-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: white;
    border: 1px solid #e8dfd0;
    border-radius: 8px;
  }
  .question-row .emoji { font-size: 1.4rem; }
  .question-row .info { flex: 1; min-width: 0; }
  .question-row .title { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
  .question-row .meta { font-size: 0.75rem; color: #888; }
  .question-row .actions { display: flex; gap: 6px; }

  .schedule-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .schedule-grid { grid-template-columns: 1fr; } }

  .checkbox-list {
    max-height: 400px;
    overflow-y: auto;
    border: 1px solid #e8dfd0;
    border-radius: 8px;
    background: white;
    padding: 8px;
  }
  .checkbox-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
  }
  .checkbox-item:last-child { border-bottom: none; }
  .checkbox-item input { width: 18px; height: 18px; flex: 0 0 18px; }
  .checkbox-item label { margin: 0; cursor: pointer; flex: 1; font-weight: normal; }
  .checkbox-item .preview { display: block; font-size: 0.75rem; color: #888; margin-top: 2px; }

  .status { padding: 12px; border-radius: 8px; margin-top: 16px; font-weight: 600; }
  .status.success { background: #d4edda; color: #155724; }
  .status.error { background: #f8d7da; color: #721c24; }
  .status.info { background: #d1ecf1; color: #0c5460; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: #fffbf3;
    border: 1px solid #e8dfd0;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }
  .stat-num { font-size: 2rem; font-weight: 900; color: #002868; }
  .stat-label { font-size: 0.8rem; color: #666; margin-top: 4px; }

  .selected-count {
    font-size: 0.85rem;
    font-weight: 600;
    color: #002868;
    padding: 8px 12px;
    background: #e3edff;
    border-radius: 6px;
    margin-bottom: 12px;
    display: inline-block;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Geo<span>History</span> Admin</h1>
  <p class="subtitle">Manage questions, schedule daily rounds, view stats</p>

  <div class="tabs">
    <button class="tab active" data-tab="schedule">📅 Schedule</button>
    <button class="tab" data-tab="questions">📝 Questions</button>
    <button class="tab" data-tab="stats">📊 Stats</button>
  </div>

  <div class="section active" id="schedule">
    <div class="card">
      <h2 style="margin-bottom: 16px;">Schedule a Daily Round</h2>

      <div class="schedule-grid">
        <div>
          <label>Date</label>
          <input type="date" id="schDate" />
        </div>
        <div>
          <label>Theme</label>
          <input type="text" id="schTheme" placeholder="e.g., Business Through History" />
        </div>
      </div>

      <label style="margin-top: 16px;">Select 5 Questions</label>
      <div class="selected-count" id="selectedCount">0 / 5 selected</div>
      <div class="checkbox-list" id="schQuestionList">Loading...</div>

      <div class="row" style="margin-top: 16px;">
        <button class="btn btn-primary" onclick="saveSchedule()">💾 Save Schedule</button>
        <button class="btn btn-secondary" onclick="loadSchedule()">↻ Load Existing</button>
      </div>

      <div id="schStatus"></div>
    </div>
  </div>

  <div class="section" id="questions">
    <div class="card">
      <h2 style="margin-bottom: 16px;" id="qFormTitle">Add New Question</h2>
      <input type="hidden" id="qId" />

      <div class="row">
        <div>
          <label>Title (short)</label>
          <input type="text" id="qTitle" placeholder="e.g., Black Tuesday" />
        </div>
        <div>
          <label>Year</label>
          <input type="text" id="qYear" placeholder="e.g., 1929" />
        </div>
      </div>

      <label>Clue</label>
      <textarea id="qClue" placeholder="The October 1929 crash occurred here..."></textarea>

      <div class="row">
        <div>
          <label>Location Name</label>
          <input type="text" id="qLocation" placeholder="e.g., New York, NY" />
        </div>
        <div>
          <label>Emoji</label>
          <input type="text" id="qEmoji" placeholder="📉" maxlength="2" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>Latitude</label>
          <input type="number" id="qLat" step="0.0001" placeholder="40.7069" />
        </div>
        <div>
          <label>Longitude</label>
          <input type="number" id="qLng" step="0.0001" placeholder="-74.0111" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>Theme</label>
          <input type="text" id="qTheme" placeholder="e.g., Business Through History" />
        </div>
        <div>
          <label>Difficulty (1-5)</label>
          <input type="number" id="qDifficulty" min="1" max="5" value="1" />
        </div>
      </div>

      <div class="row" style="margin-top: 12px;">
        <button class="btn btn-primary" onclick="saveQuestion()">💾 Save Question</button>
        <button class="btn btn-secondary" onclick="clearQuestionForm()">✕ Clear</button>
      </div>

      <div id="qStatus"></div>
    </div>

    <div class="card">
      <h2 style="margin-bottom: 12px;">All Questions (<span id="qCount">0</span>)</h2>
      <div class="question-list" id="qList">Loading...</div>
    </div>
  </div>

  <div class="section" id="stats">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="statUsers">—</div>
        <div class="stat-label">Total Users</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statGames">—</div>
        <div class="stat-label">Games Played</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statToday">—</div>
        <div class="stat-label">Played Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statAvg">—</div>
        <div class="stat-label">Avg Score</div>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-bottom: 12px;">Recent Top Scores</h2>
      <div id="recentScores">Loading...</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://pmxmxfvtnosyyjkiwvim.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBteG14ZnZ0bm9zeXlqa2l3dmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMjU5MTIsImV4cCI6MjA5NDcwMTkxMn0.bQKytFaCAvDX7i8kkqfvkZOQTbGHZyAPQC--1JF1B2c';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let allQuestions = [];
const $ = (id) => document.getElementById(id);

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    $(tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'stats') loadStats();
  });
});

window.addEventListener('DOMContentLoaded', () => {
  $('schDate').value = new Date().toISOString().split('T')[0];
  loadQuestions();
});

async function loadQuestions() {
  const { data, error } = await sb.from('questions').select('*').order('id', { ascending: false });
  if (error) {
    $('qList').innerHTML = '<p style="color:#c00;">Error: ' + error.message + '</p>';
    return;
  }
  allQuestions = data || [];
  renderQuestionList();
  renderScheduleCheckboxes();
  $('qCount').textContent = allQuestions.length;
}

function renderQuestionList() {
  if (allQuestions.length === 0) {
    $('qList').innerHTML = '<p style="color:#888;">No questions yet. Add one above.</p>';
    return;
  }
  $('qList').innerHTML = allQuestions.map(q => `
    <div class="question-row">
      <div class="emoji">${q.emoji || '📍'}</div>
      <div class="info">
        <div class="title">${escapeHtml(q.title)}</div>
        <div class="meta">${escapeHtml(q.location)} • ${q.year} • ${escapeHtml(q.theme || 'No theme')}</div>
      </div>
      <div class="actions">
        <button class="btn btn-secondary btn-sm" onclick="editQuestion(${q.id})">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteQuestion(${q.id})">Delete</button>
      </div>
    </div>
  `).join('');
}

function editQuestion(id) {
  const q = allQuestions.find(x => x.id === id);
  if (!q) return;
  $('qId').value = q.id;
  $('qTitle').value = q.title;
  $('qYear').value = q.year;
  $('qClue').value = q.clue;
  $('qLocation').value = q.location;
  $('qEmoji').value = q.emoji || '';
  $('qLat').value = q.answer_lat;
  $('qLng').value = q.answer_lng;
  $('qTheme').value = q.theme || '';
  $('qDifficulty').value = q.difficulty || 1;
  $('qFormTitle').textContent = 'Edit Question #' + q.id;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearQuestionForm() {
  ['qId','qTitle','qYear','qClue','qLocation','qEmoji','qLat','qLng','qTheme'].forEach(id => $(id).value = '');
  $('qDifficulty').value = 1;
  $('qFormTitle').textContent = 'Add New Question';
  $('qStatus').innerHTML = '';
}

async function saveQuestion() {
  const id = $('qId').value;
  const data = {
    title: $('qTitle').value.trim(),
    year: $('qYear').value.trim(),
    clue: $('qClue').value.trim(),
    location: $('qLocation').value.trim(),
    emoji: $('qEmoji').value.trim() || '📍',
    answer_lat: parseFloat($('qLat').value),
    answer_lng: parseFloat($('qLng').value),
    theme: $('qTheme').value.trim(),
    difficulty: parseInt($('qDifficulty').value) || 1
  };

  if (!data.title || !data.clue || !data.location || isNaN(data.answer_lat) || isNaN(data.answer_lng)) {
    showStatus('qStatus', 'Please fill in title, clue, location, and coordinates.', 'error');
    return;
  }

  let result;
  if (id) {
    result = await sb.from('questions').update(data).eq('id', id);
  } else {
    result = await sb.from('questions').insert(data);
  }

  if (result.error) {
    showStatus('qStatus', 'Error: ' + result.error.message, 'error');
  } else {
    showStatus('qStatus', id ? 'Question updated!' : 'Question added!', 'success');
    clearQuestionForm();
    loadQuestions();
  }
}

async function deleteQuestion(id) {
  if (!confirm('Delete this question? This cannot be undone.')) return;
  const { error } = await sb.from('questions').delete().eq('id', id);
  if (error) alert('Error: ' + error.message);
  else loadQuestions();
}

function renderScheduleCheckboxes() {
  if (allQuestions.length === 0) {
    $('schQuestionList').innerHTML = '<p style="padding:12px;color:#888;">No questions to schedule. Add some first.</p>';
    return;
  }
  $('schQuestionList').innerHTML = allQuestions.map(q => `
    <div class="checkbox-item">
      <input type="checkbox" id="sch_${q.id}" data-qid="${q.id}" onchange="updateSelectedCount()" />
      <label for="sch_${q.id}">
        ${q.emoji} <strong>${escapeHtml(q.title)}</strong> • ${escapeHtml(q.location)}
        <span class="preview">${escapeHtml(q.clue.substring(0, 80))}...</span>
      </label>
    </div>
  `).join('');
  updateSelectedCount();
}

function updateSelectedCount() {
  const count = document.querySelectorAll('#schQuestionList input:checked').length;
  $('selectedCount').textContent = `${count} / 5 selected`;
  $('selectedCount').style.background = count === 5 ? '#d4edda' : '#e3edff';
  $('selectedCount').style.color = count === 5 ? '#155724' : '#002868';
}

async function loadSchedule() {
  const date = $('schDate').value;
  const { data, error } = await sb.from('daily_rounds').select('*').eq('date', date).maybeSingle();
  if (error) {
    showStatus('schStatus', 'Error: ' + error.message, 'error');
    return;
  }
  if (!data) {
    showStatus('schStatus', 'No round scheduled for this date yet.', 'info');
    document.querySelectorAll('#schQuestionList input').forEach(cb => cb.checked = false);
    $('schTheme').value = '';
    updateSelectedCount();
    return;
  }
  $('schTheme').value = data.theme;
  document.querySelectorAll('#schQuestionList input').forEach(cb => {
    cb.checked = data.question_ids.includes(parseInt(cb.dataset.qid));
  });
  updateSelectedCount();
  showStatus('schStatus', 'Loaded schedule for ' + date, 'success');
}

async function saveSchedule() {
  const date = $('schDate').value;
  const theme = $('schTheme').value.trim();
  const selectedIds = Array.from(document.querySelectorAll('#schQuestionList input:checked'))
    .map(cb => parseInt(cb.dataset.qid));

  if (!date) return showStatus('schStatus', 'Please select a date.', 'error');
  if (!theme) return showStatus('schStatus', 'Please enter a theme.', 'error');
  if (selectedIds.length !== 5) return showStatus('schStatus', `Please select exactly 5 questions (currently ${selectedIds.length}).`, 'error');

  const { error } = await sb.from('daily_rounds').upsert({
    date, theme, question_ids: selectedIds, status: 'active'
  }, { onConflict: 'date' });

  if (error) showStatus('schStatus', 'Error: ' + error.message, 'error');
  else showStatus('schStatus', `✅ Schedule saved for ${date}!`, 'success');
}

async function loadStats() {
  const { count: userCount } = await sb.from('users').select('*', { count: 'exact', head: true });
  $('statUsers').textContent = userCount || 0;

  const { count: gameCount } = await sb.from('scores').select('*', { count: 'exact', head: true });
  $('statGames').textContent = gameCount || 0;

  const today = new Date().toISOString().split('T')[0];
  const { count: todayCount } = await sb.from('scores').select('*', { count: 'exact', head: true }).eq('date', today);
  $('statToday').textContent = todayCount || 0;

  const { data: scores } = await sb.from('scores').select('total_score');
  if (scores && scores.length > 0) {
    const avg = scores.reduce((a, s) => a + s.total_score, 0) / scores.length;
    $('statAvg').textContent = Math.round(avg);
  } else {
    $('statAvg').textContent = 0;
  }

  const { data: topScores } = await sb.from('scores')
    .select('username, total_score, date, theme')
    .order('created_at', { ascending: false })
    .limit(10);

  if (topScores && topScores.length > 0) {
    $('recentScores').innerHTML = `
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr style="border-bottom:2px solid #e8dfd0;">
            <th style="text-align:left;padding:8px;font-size:0.85rem;">Player</th>
            <th style="text-align:left;padding:8px;font-size:0.85rem;">Date</th>
            <th style="text-align:left;padding:8px;font-size:0.85rem;">Theme</th>
            <th style="text-align:right;padding:8px;font-size:0.85rem;">Score</th>
          </tr>
        </thead>
        <tbody>
          ${topScores.map(s => `
            <tr style="border-bottom:1px solid #f0f0f0;">
              <td style="padding:8px;font-size:0.9rem;">${escapeHtml(s.username)}</td>
              <td style="padding:8px;font-size:0.85rem;color:#888;">${s.date}</td>
              <td style="padding:8px;font-size:0.85rem;color:#888;">${escapeHtml(s.theme || '-')}</td>
              <td style="padding:8px;text-align:right;font-weight:600;">${s.total_score}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } else {
    $('recentScores').innerHTML = '<p style="color:#888;">No scores yet.</p>';
  }
}

function showStatus(id, msg, type) {
  $(id).innerHTML = `<div class="status ${type}">${msg}</div>`;
  setTimeout(() => { $(id).innerHTML = ''; }, 4000);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
