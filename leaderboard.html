<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf8f5">
<title>Leaderboard · GeoHistory</title>
<!-- Favicon -->
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<!-- SEO -->
<meta name="description" content="Today's GeoHistory leaderboard — see how you rank against other players." />
<link rel="canonical" href="https://playgeohistory.com/leaderboard.html" />
<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:url" content="https://playgeohistory.com/leaderboard.html" />
<meta property="og:site_name" content="GeoHistory" />
<meta property="og:title" content="Leaderboard · GeoHistory" />
<meta property="og:description" content="Today's GeoHistory leaderboard — see how you rank against other players." />
<meta property="og:image" content="https://playgeohistory.com/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Leaderboard · GeoHistory" />
<meta name="twitter:description" content="Today's GeoHistory leaderboard — see how you rank against other players." />
<meta name="twitter:image" content="https://playgeohistory.com/og-image.png" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/styles.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    font-family: var(--font-ui);
    color: var(--ink);
    padding: 16px 12px 60px;
    -webkit-font-smoothing: antialiased;
  }

  .container { max-width: 412px; margin: 0 auto; }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .back-btn {
    background: var(--paper-2);
    border: 1px solid oklch(0.88 0.02 80);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.3rem;
    text-decoration: none;
    color: var(--ink);
    flex-shrink: 0;
  }
  .lb-wordmark {
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: 800;
    font-style: italic;
    letter-spacing: -0.02em;
    flex: 1;
    color: var(--ink);
  }
  .lb-wordmark span { color: var(--good); }

  /* PRIMARY TAB NAV */
  .tab-nav {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    border-bottom: 2px solid oklch(0.88 0.02 80);
  }
  .tab-link {
    flex: 1;
    background: none;
    border: none;
    padding: 12px 8px;
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--ink-soft);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    text-decoration: none;
    text-align: center;
    transition: color .15s;
  }
  .tab-link.active {
    color: var(--crimson);
    border-bottom-color: var(--crimson);
  }

  /* SUB TABS */
  .sub-tabs {
    display: flex;
    background: var(--paper-2);
    border: 1px solid oklch(0.88 0.02 80);
    border-radius: var(--radius);
    padding: 4px;
    margin-bottom: 16px;
  }
  .sub-tab {
    flex: 1;
    background: none;
    border: none;
    padding: 9px 8px;
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: calc(var(--radius) - 4px);
    transition: all 0.2s;
  }
  .sub-tab.active {
    background: var(--slate);
    color: var(--on-slate);
  }

  /* DAY NAVIGATION */
  .day-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--paper-2);
    border: 1px solid oklch(0.88 0.02 80);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 14px;
  }
  .day-arrow {
    background: var(--paper);
    border: 1px solid oklch(0.88 0.02 80);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .15s;
  }
  .day-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
  .day-arrow:active:not(:disabled) { transform: scale(0.95); }
  .day-label { text-align: center; flex: 1; }
  .day-name { font-weight: 700; font-size: 0.95rem; color: var(--ink); }
  .day-date { font-size: 0.75rem; color: var(--ink-soft); margin-top: 2px; }

  /* META */
  .meta {
    background: var(--paper-2);
    border: 1px solid oklch(0.88 0.02 80);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .meta-theme {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--ink);
  }
  .meta-count { font-size: 0.8rem; color: var(--ink-soft); }

  /* REFRESH */
  .refresh-btn {
    background: var(--paper-2);
    border: 1px solid oklch(0.88 0.02 80);
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink-soft);
    margin-bottom: 14px;
    font-family: var(--font-ui);
    transition: opacity .15s;
  }
  .refresh-btn:active { opacity: 0.7; }
  .refresh-btn:disabled { opacity: 0.4; cursor: wait; }

  /* SCORE OF THE WEEK */
  .sotw {
    background: var(--slate);
    border-radius: var(--radius);
    padding: 18px 16px;
    margin-bottom: 18px;
  }
  .sotw-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--brass);
    font-weight: 700;
    margin-bottom: 8px;
    font-family: var(--font-ui);
  }
  .sotw-player {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1.4rem;
    font-weight: 800;
    margin-bottom: 2px;
    color: var(--on-slate);
  }
  .sotw-meta {
    font-size: 0.85rem;
    color: var(--on-slate-soft);
    margin-bottom: 8px;
  }
  .sotw-score {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 2.3rem;
    color: var(--brass);
    line-height: 1;
  }
  .sotw-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .sotw-left { flex: 1; min-width: 0; }

  /* LEADERBOARD */
  .leaderboard {
    background: var(--paper-2);
    border: 1px solid oklch(0.88 0.02 80);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-bottom: 1px solid oklch(0.88 0.02 80);
  }
  .row:last-child { border-bottom: none; }
  .row.is-me { background: oklch(0.97 0.04 85); }
  .rank {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.25rem;
    min-width: 36px;
    text-align: center;
    color: var(--ink-soft);
  }
  .rank.gold { color: var(--brass); font-size: 1.5rem; }
  .rank.silver { color: oklch(0.72 0.02 260); font-size: 1.4rem; }
  .rank.bronze { color: oklch(0.6 0.1 55); font-size: 1.4rem; }
  .username {
    flex: 1;
    font-weight: 600;
    font-size: 0.95rem;
    word-break: break-word;
    color: var(--ink);
  }
  .me-tag {
    display: inline-block;
    background: var(--brass);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    text-transform: uppercase;
  }
  .score {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 1rem;
    flex-shrink: 0;
    color: var(--ink);
  }

  /* SECTION TITLE (Weekly) */
  .section-title {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--ink);
  }

  /* STATES */
  .status {
    background: var(--paper-2);
    border: 1px solid oklch(0.88 0.02 80);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align: center;
    color: var(--ink-soft);
  }
  .status .big { font-size: 2.5rem; margin-bottom: 10px; }
  .status h3 {
    font-family: var(--font-display);
    font-size: 1.2rem;
    margin-bottom: 6px;
    color: var(--ink);
    font-style: italic;
  }
  .status p { font-size: 0.9rem; margin-bottom: 14px; }
  .play-btn {
    display: inline-block;
    background: var(--crimson);
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: var(--radius);
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <a href="/" class="back-btn">←</a>
    <h1 class="lb-wordmark">Geo<span>History</span></h1>
  </div>

  <!-- Primary nav: Leaderboard vs My Stats -->
  <div class="tab-nav">
    <a href="/leaderboard.html" class="tab-link active">🏆 Leaderboard</a>
    <a href="/stats.html" class="tab-link">📊 My Stats</a>
  </div>

  <!-- Sub-tabs: Daily vs Weekly -->
  <div class="sub-tabs">
    <button class="sub-tab active" id="tab-daily" onclick="switchTab('daily')">Daily</button>
    <button class="sub-tab" id="tab-weekly" onclick="switchTab('weekly')">Weekly</button>
  </div>

  <!-- DAILY VIEW -->
  <div id="daily-view">
    <div class="day-nav">
      <button class="day-arrow" id="prev-day" onclick="changeDay(-1)">←</button>
      <div class="day-label">
        <div class="day-name" id="day-name">Today</div>
        <div class="day-date" id="day-date">—</div>
      </div>
      <button class="day-arrow" id="next-day" onclick="changeDay(1)">→</button>
    </div>

    <div class="meta" id="meta" style="display:none;">
      <div class="meta-theme" id="theme">—</div>
      <div class="meta-count" id="count">—</div>
    </div>

    <button class="refresh-btn" onclick="loadDaily()">↻ Refresh</button>

    <div id="daily-content">
      <div class="status">
        <div class="big">⏳</div>
        <h3>Loading...</h3>
      </div>
    </div>
  </div>

  <!-- WEEKLY VIEW -->
  <div id="weekly-view" style="display:none;">
    <button class="refresh-btn" onclick="loadWeekly()">↻ Refresh</button>
    <div id="weekly-content">
      <div class="status">
        <div class="big">⏳</div>
        <h3>Loading...</h3>
      </div>
    </div>
  </div>

</div>

<script>
const sb = window.supabase.createClient(
  'https://pmxmxfvtnosyyjkiwvim.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBteG14ZnZ0bm9zeXlqa2l3dmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMjU5MTIsImV4cCI6MjA5NDcwMTkxMn0.bQKytFaCAvDX7i8kkqfvkZOQTbGHZyAPQC--1JF1B2c'
);

const $ = (id) => document.getElementById(id);

let dayOffset = 0;
let activeTab = 'daily';

function getGameDate(offset = 0) {
  const now = new Date();
  const utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
  const estMs = utcMs - (5 * 60 * 60 * 1000);
  const adjusted = new Date(estMs - (3 * 60 * 60 * 1000));
  adjusted.setUTCDate(adjusted.getUTCDate() + offset);
  return adjusted.toISOString().split('T')[0];
}

function getDayLabel(offset) {
  if (offset === 0) return 'Today';
  if (offset === -1) return 'Yesterday';
  const d = new Date(getGameDate(offset) + 'T12:00:00Z');
  return d.toLocaleDateString('en-US', { weekday: 'long' });
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00Z');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatDayLabel(dateStr) {
  const today = getGameDate(0);
  const yesterday = getGameDate(-1);
  if (dateStr === today) return 'Today';
  if (dateStr === yesterday) return 'Yesterday';
  const d = new Date(dateStr + 'T12:00:00Z');
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getRankDisplay(rank) {
  if (rank === 1) return { text: '🥇', cls: 'gold' };
  if (rank === 2) return { text: '🥈', cls: 'silver' };
  if (rank === 3) return { text: '🥉', cls: 'bronze' };
  return { text: '#' + rank, cls: '' };
}

function switchTab(tab) {
  activeTab = tab;
  if (tab === 'daily') {
    $('tab-daily').classList.add('active');
    $('tab-weekly').classList.remove('active');
    $('daily-view').style.display = '';
    $('weekly-view').style.display = 'none';
    loadDaily();
  } else {
    $('tab-daily').classList.remove('active');
    $('tab-weekly').classList.add('active');
    $('daily-view').style.display = 'none';
    $('weekly-view').style.display = '';
    loadWeekly();
  }
}

function updateDayNav() {
  const gameDate = getGameDate(dayOffset);
  $('day-name').textContent = getDayLabel(dayOffset);
  $('day-date').textContent = formatDate(gameDate);
  $('prev-day').disabled = dayOffset <= -6;
  $('next-day').disabled = dayOffset >= 0;
}

function changeDay(delta) {
  const newOffset = dayOffset + delta;
  if (newOffset > 0 || newOffset < -6) return;
  dayOffset = newOffset;
  updateDayNav();
  loadDaily();
}

// ─── DAILY LEADERBOARD ───
async function loadDaily() {
  $('daily-content').innerHTML = `
    <div class="status"><div class="big">⏳</div><h3>Loading...</h3></div>
  `;
  
  const gameDate = getGameDate(dayOffset);
  const username = (localStorage.getItem('geo_username') || '').toLowerCase();
  
  try {
    const [{ data: scores, error }, { data: round }] = await Promise.all([
      sb.from('scores')
        .select('username, total_score')
        .eq('date', gameDate)
        .order('total_score', { ascending: false })
        .limit(100),
      sb.from('daily_rounds')
        .select('theme')
        .eq('date', gameDate)
        .maybeSingle(),
    ]);
    
    if (error) {
      $('daily-content').innerHTML = `
        <div class="status">
          <div class="big">⚠️</div>
          <h3>Database error</h3>
          <p>${escapeHtml(error.message)}</p>
        </div>
      `;
      return;
    }
    
    if (!scores || scores.length === 0) {
      $('meta').style.display = 'none';
      $('daily-content').innerHTML = `
        <div class="status">
          <div class="big">🌍</div>
          <h3>No scores</h3>
          <p>${dayOffset === 0 ? 'Be the first to play today!' : 'No one played on this day.'}</p>
          ${dayOffset === 0 ? '<a href="/" class="play-btn">Play Now</a>' : ''}
        </div>
      `;
      return;
    }
    
    $('meta').style.display = 'flex';
    $('theme').textContent = (round && round.theme) ? round.theme : 'Round';
    $('count').textContent = `${scores.length} ${scores.length === 1 ? 'player' : 'players'}`;
    
    const rows = scores.map((s, i) => {
      const rank = i + 1;
      const rd = getRankDisplay(rank);
      const isMe = username && s.username && s.username.toLowerCase() === username;
      return `
        <div class="row ${isMe ? 'is-me' : ''}">
          <div class="rank ${rd.cls}">${rd.text}</div>
          <div class="username">
            ${escapeHtml(s.username || 'Anonymous')}
            ${isMe ? '<span class="me-tag">You</span>' : ''}
          </div>
          <div class="score">${s.total_score}</div>
        </div>
      `;
    }).join('');
    
    $('daily-content').innerHTML = `<div class="leaderboard">${rows}</div>`;
  } catch (e) {
    $('daily-content').innerHTML = `
      <div class="status"><div class="big">⚠️</div><h3>Error</h3><p>${escapeHtml(e.message || String(e))}</p></div>
    `;
  }
}

// ─── WEEKLY LEADERBOARD ───
async function loadWeekly() {
  $('weekly-content').innerHTML = `
    <div class="status"><div class="big">⏳</div><h3>Loading...</h3></div>
  `;
  
  const sevenDaysAgo = getGameDate(-6); // 7-day window
  const username = (localStorage.getItem('geo_username') || '').toLowerCase();
  
  try {
    const { data: scores, error } = await sb
      .from('scores')
      .select('username, total_score, theme, date')
      .gte('date', sevenDaysAgo)
      .order('total_score', { ascending: false });
    
    if (error) {
      $('weekly-content').innerHTML = `
        <div class="status">
          <div class="big">⚠️</div>
          <h3>Database error</h3>
          <p>${escapeHtml(error.message)}</p>
        </div>
      `;
      return;
    }
    
    if (!scores || scores.length === 0) {
      $('weekly-content').innerHTML = `
        <div class="status">
          <div class="big">🌍</div>
          <h3>No scores this week</h3>
          <p>Be the first to play!</p>
          <a href="/" class="play-btn">Play Now</a>
        </div>
      `;
      return;
    }
    
    // Score of the Week — highest single-game score in the last 7 days
    const sotw = scores[0]; // already sorted by total_score desc
    
    // Aggregate by player (case-insensitive)
    const playerTotals = new Map();
    for (const s of scores) {
      if (!s.username) continue;
      const key = s.username.toLowerCase();
      const existing = playerTotals.get(key);
      if (existing) {
        existing.total += s.total_score;
        existing.games += 1;
      } else {
        playerTotals.set(key, {
          username: s.username,
          total: s.total_score,
          games: 1
        });
      }
    }
    
    // Sort by total descending
    const ranked = Array.from(playerTotals.values()).sort((a, b) => b.total - a.total);
    
    // Build Score of the Week card
    const sotwHTML = `
      <div class="sotw">
        <div class="sotw-label">🏆 Score of the Week</div>
        <div class="sotw-row">
          <div class="sotw-left">
            <div class="sotw-player">${escapeHtml(sotw.username || 'Anonymous')}</div>
            <div class="sotw-meta">${escapeHtml(sotw.theme || '—')} · ${formatDayLabel(sotw.date)}</div>
          </div>
          <div class="sotw-score">${sotw.total_score}</div>
        </div>
      </div>
    `;
    
    // Build weekly leaderboard
    const rows = ranked.map((p, i) => {
      const rank = i + 1;
      const rd = getRankDisplay(rank);
      const isMe = username && p.username && p.username.toLowerCase() === username;
      return `
        <div class="row ${isMe ? 'is-me' : ''}">
          <div class="rank ${rd.cls}">${rd.text}</div>
          <div class="username">
            ${escapeHtml(p.username || 'Anonymous')}
            ${isMe ? '<span class="me-tag">You</span>' : ''}
          </div>
          <div class="score">${p.total}</div>
        </div>
      `;
    }).join('');
    
    $('weekly-content').innerHTML = `
      ${sotwHTML}
      <div class="section-title">📅 Last 7 Days — Total Points</div>
      <div class="leaderboard">${rows}</div>
    `;
  } catch (e) {
    $('weekly-content').innerHTML = `
      <div class="status"><div class="big">⚠️</div><h3>Error</h3><p>${escapeHtml(e.message || String(e))}</p></div>
    `;
  }
}

// Init
updateDayNav();
loadDaily();
</script>
</body>
</html>
