<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fef7ed">
<title>Leaderboard · GeoHistory</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #fef7ed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #1a1a1a;
    padding: 16px 12px 60px;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 500px; margin: 0 auto; }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .back-btn {
    background: #fffbf3;
    border: 1px solid #e8dfd0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.3rem;
    text-decoration: none;
    color: #1a1a1a;
    flex-shrink: 0;
  }
  h1 {
    font-family: ui-serif, Georgia, serif;
    font-size: 1.5rem;
    font-weight: 900;
    font-style: italic;
    letter-spacing: -0.02em;
    flex: 1;
  }
  h1 span { color: #bf0a30; }

  /* META */
  .meta {
    background: #fffbf3;
    border: 1px solid #e8dfd0;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .meta-theme {
    font-weight: 700;
    font-size: 0.95rem;
  }
  .meta-count {
    font-size: 0.8rem;
    color: #666;
  }

  /* REFRESH */
  .refresh-btn {
    background: white;
    border: 1px solid #e8dfd0;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    color: #002868;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .refresh-btn:active { transform: scale(0.97); }
  .refresh-btn:disabled { opacity: 0.5; cursor: wait; }

  /* LEADERBOARD */
  .leaderboard {
    background: #fffbf3;
    border: 1px solid #e8dfd0;
    border-radius: 12px;
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-bottom: 1px solid #e8dfd0;
  }
  .row:last-child { border-bottom: none; }
  .row.is-me {
    background: #fef3c7;
  }
  .rank {
    font-family: ui-serif, Georgia, serif;
    font-weight: 900;
    font-size: 1.25rem;
    min-width: 36px;
    text-align: center;
    color: #666;
  }
  .rank.gold { color: #d97706; font-size: 1.5rem; }
  .rank.silver { color: #9ca3af; font-size: 1.4rem; }
  .rank.bronze { color: #b45309; font-size: 1.4rem; }
  .username {
    flex: 1;
    font-weight: 600;
    font-size: 0.95rem;
    word-break: break-word;
  }
  .me-tag {
    display: inline-block;
    background: #d97706;
    color: white;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    text-transform: uppercase;
  }
  .score {
    font-family: ui-monospace, monospace;
    font-weight: 700;
    font-size: 1rem;
    flex-shrink: 0;
  }

  /* STATES */
  .status {
    background: #fffbf3;
    border: 1px solid #e8dfd0;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    color: #666;
  }
  .status .big { font-size: 2.5rem; margin-bottom: 10px; }
  .status h3 {
    font-family: ui-serif, Georgia, serif;
    font-size: 1.2rem;
    margin-bottom: 6px;
    color: #1a1a1a;
    font-style: italic;
  }
  .status p { font-size: 0.9rem; margin-bottom: 14px; }
  .play-btn {
    background: #002868;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }

  .last-updated {
    text-align: center;
    margin-top: 12px;
    font-size: 0.7rem;
    color: #888;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <a href="/" class="back-btn">←</a>
    <h1>Geo<span>History</span> Leaderboard</h1>
  </div>

  <div class="meta" id="meta" style="display:none;">
    <div class="meta-theme" id="theme">—</div>
    <div class="meta-count" id="count">—</div>
  </div>

  <button class="refresh-btn" id="refresh-btn" onclick="loadLeaderboard()">
    ↻ <span>Refresh</span>
  </button>

  <div id="content">
    <div class="status">
      <div class="big">⏳</div>
      <h3>Loading scores...</h3>
    </div>
  </div>

  <div class="last-updated" id="last-updated"></div>
</div>

<script>
const sb = window.supabase.createClient(
  'https://pmxmxfvtnosyyjkiwvim.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBteG14ZnZ0bm9zeXlqa2l3dmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMjU5MTIsImV4cCI6MjA5NDcwMTkxMn0.bQKytFaCAvDX7i8kkqfvkZOQTbGHZyAPQC--1JF1B2c'
);

const $ = (id) => document.getElementById(id);

// Get current game date (3 AM EST reset)
function getGameDate() {
  const now = new Date();
  const utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
  const estMs = utcMs - (5 * 60 * 60 * 1000);
  const adjusted = new Date(estMs - (3 * 60 * 60 * 1000));
  return adjusted.toISOString().split('T')[0];
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getRankDisplay(rank) {
  if (rank === 1) return { text: '🥇', cls: 'gold' };
  if (rank === 2) return { text: '🥈', cls: 'silver' };
  if (rank === 3) return { text: '🥉', cls: 'bronze' };
  return { text: '#' + rank, cls: '' };
}

async function loadLeaderboard() {
  const refreshBtn = $('refresh-btn');
  refreshBtn.disabled = true;
  
  const gameDate = getGameDate();
  const username = (localStorage.getItem('geo_username') || '').toLowerCase();
  
  console.log('=== LEADERBOARD LOAD ===');
  console.log('Game date:', gameDate);
  console.log('Username:', username);
  
  // Timeout fallback so it never hangs forever
  const timeoutId = setTimeout(() => {
    console.error('Leaderboard query timed out');
    $('content').innerHTML = `
      <div class="status">
        <div class="big">⏱️</div>
        <h3>Loading too slow</h3>
        <p>The database is taking longer than 8 seconds.</p>
        <button class="play-btn" onclick="loadLeaderboard()">Try Again</button>
      </div>
    `;
    refreshBtn.disabled = false;
  }, 8000);
  
  try {
    console.log('Querying Supabase...');
    
    const { data: scores, error } = await sb
      .from('scores')
      .select('username, total_score, theme')
      .eq('date', gameDate)
      .order('total_score', { ascending: false })
      .limit(100);
    
    clearTimeout(timeoutId);
    
    if (error) {
      console.error('Supabase error:', error);
      $('content').innerHTML = `
        <div class="status">
          <div class="big">⚠️</div>
          <h3>Database error</h3>
          <p>${escapeHtml(error.message || 'Unknown error')}</p>
          <button class="play-btn" onclick="loadLeaderboard()">Try Again</button>
        </div>
      `;
      refreshBtn.disabled = false;
      return;
    }
    
    console.log('Got', scores?.length || 0, 'scores:', scores);
    
    if (!scores || scores.length === 0) {
      $('meta').style.display = 'none';
      $('content').innerHTML = `
        <div class="status">
          <div class="big">🌍</div>
          <h3>No scores yet today</h3>
          <p>Be the first to play!</p>
          <a href="/" class="play-btn">Play Now</a>
        </div>
      `;
      const now = new Date();
      $('last-updated').textContent = `Last checked ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
      refreshBtn.disabled = false;
      return;
    }
    
    // Show meta info
    $('meta').style.display = 'flex';
    $('theme').textContent = scores[0].theme || 'Today\'s Round';
    $('count').textContent = `${scores.length} ${scores.length === 1 ? 'player' : 'players'}`;
    
    // Render rows
    const rows = scores.map((s, i) => {
      const rank = i + 1;
      const rankDisplay = getRankDisplay(rank);
      const isMe = username && s.username && s.username.toLowerCase() === username;
      return `
        <div class="row ${isMe ? 'is-me' : ''}">
          <div class="rank ${rankDisplay.cls}">${rankDisplay.text}</div>
          <div class="username">
            ${escapeHtml(s.username || 'Anonymous')}
            ${isMe ? '<span class="me-tag">You</span>' : ''}
          </div>
          <div class="score">${s.total_score}</div>
        </div>
      `;
    }).join('');
    
    $('content').innerHTML = `<div class="leaderboard">${rows}</div>`;
    
    const now = new Date();
    $('last-updated').textContent = `Last updated ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
    
  } catch (e) {
    clearTimeout(timeoutId);
    console.error('Caught error:', e);
    $('content').innerHTML = `
      <div class="status">
        <div class="big">⚠️</div>
        <h3>Something went wrong</h3>
        <p>${escapeHtml(e.message || String(e))}</p>
        <button class="play-btn" onclick="loadLeaderboard()">Try Again</button>
      </div>
    `;
  } finally {
    refreshBtn.disabled = false;
  }
}

// Load on page open
loadLeaderboard();
</script>

</body>
</html>
