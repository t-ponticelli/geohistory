<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing you in… · GeoHistory</title>
<!-- Internal redirect page — exclude from search indexing -->
<meta name="robots" content="noindex, nofollow" />
<link rel="canonical" href="https://playgeohistory.com/" />
<link rel="icon" type="image/png" href="/favicon.png" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: oklch(0.974 0.009 235);
    font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: oklch(0.31 0.055 252);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .box {
    background: oklch(0.996 0.004 235);
    border: 1px solid oklch(0.90 0.022 235);
    border-radius: 22px;
    padding: 40px 28px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 1px 2px oklch(0.3 0.04 250 / 0.06), 0 18px 40px -24px oklch(0.3 0.06 250 / 0.40);
  }
  .icon { font-size: 3rem; margin-bottom: 12px; }
  h1 {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 600;
    font-size: 1.5rem;
    margin-bottom: 8px;
    color: oklch(0.31 0.055 252);
  }
  p {
    color: oklch(0.47 0.045 250);
    margin-bottom: 18px;
    font-size: 0.95rem;
  }
  .spinner {
    width: 24px;
    height: 24px;
    border: 3px solid oklch(0.90 0.022 235);
    border-top-color: oklch(0.45 0.105 245);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn {
    background: oklch(0.45 0.105 245);
    color: white;
    border: none;
    padding: 14px 24px;
    border-radius: 16px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    font-family: inherit;
    box-shadow: 0 6px 0 oklch(0.36 0.092 247);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 4px 0 oklch(0.36 0.092 247); }
  .err { color: oklch(0.585 0.205 24); font-size: 0.85rem; }
</style>
</head>
<body>
<div class="box" id="box">
  <div class="spinner"></div>
  <h1>Signing you in…</h1>
  <p>Just a moment.</p>
</div>

<script>
const sb = window.supabase.createClient(
  'https://pmxmxfvtnosyyjkiwvim.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBteG14ZnZ0bm9zeXlqa2l3dmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMjU5MTIsImV4cCI6MjA5NDcwMTkxMn0.bQKytFaCAvDX7i8kkqfvkZOQTbGHZyAPQC--1JF1B2c'
);

const $ = (id) => document.getElementById(id);

function showError(msg) {
  $('box').innerHTML = `
    <div class="icon">⚠️</div>
    <h1>Couldn't sign you in</h1>
    <p class="err">${(msg || 'Unknown error').replace(/</g,'&lt;')}</p>
    <a href="/" class="btn">Back to game</a>
  `;
}

async function handleCallback() {
  try {
    let { data: { session }, error } = await sb.auth.getSession();
    if (error) throw error;

    if (!session) {
      await new Promise(r => setTimeout(r, 800));
      const retry = await sb.auth.getSession();
      session = retry.data.session;
      if (!session) {
        throw new Error('Could not sign you in. The magic link may have expired. Please request a new one.');
      }
    }

    const authId = session.user.id;
    const email = session.user.email;

    let { data: existing } = await sb
      .from('users')
      .select('id, display_name')
      .eq('auth_id', authId)
      .maybeSingle();

    if (!existing) {
      const pendingName = localStorage.getItem('pending_display_name') || email.split('@')[0];
      const { error: insertErr } = await sb
        .from('users')
        .insert({ auth_id: authId, email: email, display_name: pendingName });
      if (insertErr) {
        console.error('User row insert error:', insertErr);
        throw new Error('Sign-in worked but we could not create your profile. Please contact support.');
      }
      localStorage.removeItem('pending_display_name');
    }

    const pendingGroup = localStorage.getItem('pending_group_join');
    if (pendingGroup) {
      localStorage.removeItem('pending_group_join');
      window.location.replace('/?g=' + pendingGroup);
    } else {
      window.location.replace('/');
    }
  } catch (e) {
    console.error('Auth callback error:', e);
    showError(e.message);
  }
}

handleCallback();
</script>
</body>
</html>
